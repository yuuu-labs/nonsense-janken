<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>デタラメじゃんけん</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --surface-2:#ffffff;
  --surface-1:#f1efe8;
  --surface-0:#e9e7de;
  --text-primary:#1a1a1a;
  --text-secondary:#5f5e5a;
  --text-muted:#888780;
  --border:#00000018;
  --border-strong:#00000030;
  --text-success:#27500a;
  --bg-success:#eaf3de;
  --text-danger:#791f1f;
  --bg-danger:#fcebeb;
  --text-accent:#0c447c;
  --bg-accent:#e6f1fb;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;padding:32px 16px 64px;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
h1{font-size:20px;font-weight:600;text-align:center;margin:0 0 4px;}
p.sub{text-align:center;color:var(--text-secondary);font-size:13px;margin:0 0 28px;}
button{font-family:inherit;font-size:16px;border:0.5px solid var(--border-strong);border-radius:8px;background:var(--surface-2);color:var(--text-primary);padding:14px 0;cursor:pointer;transition:background .1s;}
button:hover{background:var(--surface-1);}
button:active{transform:scale(0.97);}
label{cursor:pointer;}
input[type=radio]{cursor:pointer;}
.panelbtn{padding:8px 14px;font-size:13px;}
table{width:100%;font-size:12px;border-collapse:collapse;}
.movebtn{font-size:18px;font-weight:600;padding:20px 0;}
</style>
</head>
<body>

<h1>デタラメじゃんけん</h1>
<p class="sub">CPUの手はランダムじゃない。隠されたルールで動いている。</p>

<div style="max-width:360px;margin:0 auto 1.5rem;background:var(--surface-1);border-radius:12px;border:0.5px solid var(--border);padding:1rem;">
  <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);margin-bottom:10px;">
    <span id="scoreLine">勝ち 0 ／ 負け 0 ／ あいこ 0</span>
    <span id="roundLine">第0回</span>
  </div>
  <div id="resultLine" style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:10px;padding:18px;text-align:center;font-size:16px;font-weight:600;margin-bottom:14px;min-height:28px;">まずは手を出してみよう</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
    <button class="movebtn" onclick="play(0)">グー</button>
    <button class="movebtn" onclick="play(1)">チョキ</button>
    <button class="movebtn" onclick="play(2)">パー</button>
  </div>
</div>

<div style="max-width:420px;margin:0 auto;">
  <p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px;font-weight:600;">履歴</p>
  <div id="historyList" style="margin-bottom:1.5rem;"></div>

  <p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px;font-weight:600;">答え合わせ: CPUはどのルールで手を決めている?</p>
  <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:8px;padding:10px 14px;">
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="alwaysRock"> CPUは常にグーを出す</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="mirror"> CPUはあなたと同じ手を出す(毎回あいこ)</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="alwaysPlayerWins"> CPUはあなたが勝つ手を出す(常にあなたの勝ち)</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="alwaysCpuWins"> CPUはあなたに勝つ手を出す(常にCPUの勝ち)</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="prevMove"> CPUは1回前のあなたの手をそのまま出す</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="beatsPrev"> CPUは1回前のあなたの手に勝つ手を出す</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="losesToPrev"> CPUは1回前のあなたの手に負ける手を出す</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="firstMoveRepeat"> CPUは最初にあなたが出した手をずっと出し続ける</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="cyclicByRound"> CPUはグー→チョキ→パーの順に手を巡回させる</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="radio" name="ruleGuess" value="sumMod3"> CPUはあなたの手の合計を3で割った余りで決める</label>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="panelbtn" onclick="judgeGuess()" style="flex:1;">答え合わせ</button>
    <button class="panelbtn" onclick="giveUp()" style="flex:1;">ギブアップして答えを見る</button>
  </div>
  <div style="margin-top:10px;">
    <button class="panelbtn" onclick="newGame()" style="width:100%;">新しいルールで再挑戦</button>
  </div>
  <div id="guessResult"></div>
</div>

<script>
const MOVES = ['グー','チョキ','パー'];

const RULES = [
  {id:'alwaysRock', name:'CPUは常にグーを出す', fn:ctx=> 0},
  {id:'mirror', name:'CPUはあなたと同じ手を出す(毎回あいこ)', fn:ctx=> ctx.player},
  {id:'alwaysPlayerWins', name:'CPUはあなたが勝つ手を出す(常にあなたの勝ち)', fn:ctx=> (ctx.player+1)%3},
  {id:'alwaysCpuWins', name:'CPUはあなたに勝つ手を出す(常にCPUの勝ち)', fn:ctx=> (ctx.player+2)%3},
  {id:'prevMove', name:'CPUは1回前のあなたの手をそのまま出す', fn:ctx=> ctx.prev===null ? 0 : ctx.prev},
  {id:'beatsPrev', name:'CPUは1回前のあなたの手に勝つ手を出す', fn:ctx=> ctx.prev===null ? 0 : (ctx.prev+2)%3},
  {id:'losesToPrev', name:'CPUは1回前のあなたの手に負ける手を出す', fn:ctx=> ctx.prev===null ? 0 : (ctx.prev+1)%3},
  {id:'firstMoveRepeat', name:'CPUは最初にあなたが出した手をずっと出し続ける', fn:ctx=> ctx.firstMove===null ? 0 : ctx.firstMove},
  {id:'cyclicByRound', name:'CPUはグー→チョキ→パーの順に手を巡回させる', fn:ctx=> (ctx.round-1)%3},
  {id:'sumMod3', name:'CPUはあなたの手の合計を3で割った余りで決める', fn:ctx=> ctx.sumIncludingCurrent%3}
];

let round=0, history=[], score={win:0,lose:0,draw:0}, currentRule=null;

function pickRule(){ return RULES[Math.floor(Math.random()*RULES.length)]; }

function play(playerMove){
  round++;
  const prev = history.length ? history[history.length-1].player : null;
  const firstMove = history.length ? history[0].player : null;
  const sumIncludingCurrent = history.reduce((s,h)=>s+h.player,0) + playerMove;
  const ctx = {player:playerMove, prev, firstMove, round, sumIncludingCurrent};
  let cpu = currentRule.fn(ctx);
  cpu = ((cpu%3)+3)%3;

  let result;
  if(cpu===playerMove) result='draw';
  else if(playerMove === (cpu+1)%3) result='win';
  else result='lose';

  if(result==='win') score.win++;
  else if(result==='lose') score.lose++;
  else score.draw++;

  history.push({round, player:playerMove, cpu, result});
  render();
}

function resultLabel(result){
  if(result==='win') return 'あなたの勝ち';
  if(result==='lose') return 'あなたの負け';
  return 'あいこ';
}

function newGame(){
  currentRule = pickRule();
  round=0; history=[]; score={win:0,lose:0,draw:0};
  document.querySelectorAll('input[name="ruleGuess"]').forEach(r=>r.checked=false);
  const resultBox=document.getElementById('guessResult'); if(resultBox) resultBox.innerHTML='';
  document.getElementById('resultLine').textContent = 'まずは手を出してみよう';
  render();
}

function judgeGuess(){
  const checked=document.querySelector('input[name="ruleGuess"]:checked');
  const resultBox=document.getElementById('guessResult');
  if(!checked){ resultBox.innerHTML='<p style="color:var(--text-muted);font-size:13px;margin:8px 0 0;">ルールを1つ選んでください</p>'; return; }
  revealRule(checked.value===currentRule.id);
}
function giveUp(){ revealRule(null); }

function revealRule(correctOrNull){
  const resultBox=document.getElementById('guessResult');
  let msg='';
  if(correctOrNull===true){ msg='<p style="color:var(--text-success);font-weight:600;margin:10px 0 4px;">正解！</p>'; }
  else if(correctOrNull===false){ msg='<p style="color:var(--text-danger);font-weight:600;margin:10px 0 4px;">残念、違います</p>'; }
  let html = msg + '<p style="font-size:14px;margin:4px 0 12px;">正解のルール: <strong>'+currentRule.name+'</strong></p>';
  if(history.length){
    html += '<table><tr><td style="color:var(--text-muted);padding:2px 6px 2px 0;">回</td><td style="color:var(--text-muted);padding:2px 6px;">あなた</td><td style="color:var(--text-muted);padding:2px 6px;">CPU</td><td style="color:var(--text-muted);padding:2px 0 2px 6px;">結果</td></tr>';
    history.slice(-8).forEach(h=>{
      html+='<tr><td style="padding:2px 6px 2px 0;">'+h.round+'</td><td style="padding:2px 6px;">'+MOVES[h.player]+'</td><td style="padding:2px 6px;">'+MOVES[h.cpu]+'</td><td style="padding:2px 0 2px 6px;color:var(--text-secondary);">'+resultLabel(h.result)+'</td></tr>';
    });
    html+='</table>';
  }
  resultBox.innerHTML=html;
}

function render(){
  document.getElementById('scoreLine').textContent = '勝ち '+score.win+' ／ 負け '+score.lose+' ／ あいこ '+score.draw;
  document.getElementById('roundLine').textContent = '第'+round+'回';
  if(history.length){
    const last = history[history.length-1];
    document.getElementById('resultLine').textContent = 'あなた['+MOVES[last.player]+'] vs CPU['+MOVES[last.cpu]+'] → '+resultLabel(last.result);
  }
  const list=document.getElementById('historyList');
  if(history.length===0){ list.innerHTML='<p style="color:var(--text-muted);font-size:13px;margin:0;">まだ対戦していません</p>'; }
  else {
    list.innerHTML = history.slice(-6).reverse().map(h=>'<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:0.5px solid var(--border);"><span style="color:var(--text-secondary);">第'+h.round+'回 '+MOVES[h.player]+' vs '+MOVES[h.cpu]+'</span><span style="font-weight:600;">'+resultLabel(h.result)+'</span></div>').join('');
  }
}

newGame();
</script>
</body>
</html>
